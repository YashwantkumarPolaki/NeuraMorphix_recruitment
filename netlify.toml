[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/applicants/*"
  to = "/.netlify/functions/applicants/:splat"
  status = 200

[[redirects]]
  from = "/api/applicants"
  to = "/.netlify/functions/applicants"
  status = 200

[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/api/admins/*"
  to = "/.netlify/functions/admins/:splat"
  status = 200

[[redirects]]
  from = "/api/admins"
  to = "/.netlify/functions/admins"
  status = 200

[[redirects]]
  from = "/api/send-admin-invite-email"
  to = "/.netlify/functions/send-admin-invite-email"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
